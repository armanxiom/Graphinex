<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphinex Creative | Video Editing, Graphic Design & Branding Agency</title>
    <meta
      name="description"
      content="Graphinex Creative is a results-driven creative agency specializing in video editing, graphic design, and branding. We turn your content into clients."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://graphinex.in/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Graphinex Creative" />
    <meta property="og:title" content="Graphinex Creative | Video Editing, Graphic Design & Branding Agency" />
    <meta
      property="og:description"
      content="Graphinex Creative is a results-driven creative agency specializing in video editing, graphic design, and branding. We turn your content into clients."
    />
    <meta property="og:url" content="https://graphinex.in/" />
    <meta property="og:image" content="https://graphinex.in/Graphinex%20logo/logo.png" />
    <meta property="og:image:alt" content="Graphinex Creative logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Graphinex Creative | Video Editing, Graphic Design & Branding Agency" />
    <meta
      name="twitter:description"
      content="Graphinex Creative is a results-driven creative agency specializing in video editing, graphic design, and branding. We turn your content into clients."
    />
    <meta name="theme-color" content="#0f0f0f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Inter+Tight:wght@500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap"
    />
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('graphinex-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : (prefersDark ? 'dark' : 'light');

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;

          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', theme === 'dark' ? '#0c0c0c' : '#faf6f0');
          }
        } catch (error) {
          // Ignore theme bootstrap failures and let React initialize it.
        }
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Graphinex Creative",
        "url": "https://graphinex.in/",
        "logo": "https://graphinex.in/Graphinex%20logo/logo.png",
        "description": "Graphinex Creative is a results-driven creative agency specializing in video editing, graphic design, and branding."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
