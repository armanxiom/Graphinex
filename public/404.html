<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>404</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0b0b;
        color: #f7f1e8;
        font-family: Arial, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 8vw, 4rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>The requested page could not be found.</p>
    </main>
  </body>
</html>
